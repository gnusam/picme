[workspace]
resolver = "3"
members = ["crates/picme-core", "crates/picme"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# gtk4 et gstreamer alignes sur gst-plugin-gtk4 0.15 (gtk4 0.11, gstreamer 0.25)
[workspace.dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
gstreamer = "0.25"
gst-plugin-gtk4 = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 3
